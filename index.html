<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissors</title>
  </head>
  <body>
    <h1>
      - Step forth, brave soul, and declare thy weapon. Know well the ancient
      elemental triad, for each path harbors its own glory and fatal undoing -
    </h1>
    <div class="choices">
      <div class="choice" id="stone">
        <img src="rock.jpeg" alt="" />
      </div>
      <div class="choice" id="parchment">
        <img src="paper.jpeg" alt="" />
      </div>
      <div class="choice" id="twin blades">
        <img src="scissors.jpeg" alt="" />
      </div>
    </div>
    <div class="scoreboard">
      <div class="score" id="userscore">
        <p>Ø</p>
        <p>THOU</p>
      </div>
      <div class="score" id="compscore">
        <p>Ø</p>
        <p>FOE</p>
      </div>
    </div>
    <div class="msg">
      <p id="message">Choose Thy Relic!!</p>
    </div>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </body>
</html>
